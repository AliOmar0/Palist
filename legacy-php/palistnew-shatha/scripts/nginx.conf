worker_processes auto;
daemon off;
pid /home/runner/workspace/.nginx/nginx.pid;
error_log /home/runner/workspace/.nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /home/runner/workspace/scripts/nginx_mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 64m;

    client_body_temp_path /home/runner/workspace/.nginx/tmp/client_body;
    proxy_temp_path /home/runner/workspace/.nginx/tmp/proxy;
    fastcgi_temp_path /home/runner/workspace/.nginx/tmp/fastcgi;
    uwsgi_temp_path /home/runner/workspace/.nginx/tmp/uwsgi;
    scgi_temp_path /home/runner/workspace/.nginx/tmp/scgi;

    upstream php_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 0.0.0.0:5000;
        server_name _;
        root /home/runner/workspace;
        index index.php;

        # --- Security: never expose non-public repository artifacts ---
        # Replit import artifacts and infra files live under the web root, so
        # block them explicitly (prefix matches take priority over regex).
        location ^~ /attached_assets/ { deny all; return 404; }
        location ^~ /scripts/        { deny all; return 404; }
        location ^~ /backups/        { deny all; return 404; }
        location ^~ /.agents/        { deny all; return 404; }
        # Dotfiles/dotdirs (.git, .mysql, .nginx, .env, .htaccess, ...).
        location ~ /\.            { deny all; return 404; }
        # Sensitive file types anywhere in the tree.
        location ~* \.(sql|sh|bak|log|ini|md|lock|sqlite|db)$ { deny all; return 404; }
        # Un-suffixed operational files (PHP error_log, etc.) at any depth.
        location ~ (^|/)(error_log|access_log|php_errorlog)$ { deny all; return 404; }

        # Execute PHP files via the backend (never serve their source).
        location ~ \.php$ {
            proxy_pass http://php_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        # Serve real static files directly; everything else goes to the app
        # router (clean URLs, language routing, directory indexes).
        location / {
            try_files $uri @php;
        }

        location @php {
            proxy_pass http://php_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
